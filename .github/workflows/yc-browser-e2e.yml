name: YC production browser E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yc-browser-e2e.yml"
      - "backend/scripts/yc-browser-e2e.mjs"
      - "backend/src/routes/demoPage.ts"
      - "backend/src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for Vercel production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            html=$(curl --silent --show-error --fail https://silvervisit-api.vercel.app/demo || true)
            if echo "$html" | grep -q "Run full AI navigator" && echo "$html" | grep -q "waiting-check-provider-ready-btn"; then
              echo "Latest demo is live"
              exit 0
            fi
            echo "Waiting for latest Vercel demo ($attempt/40)"
            sleep 10
          done
          echo "Latest Vercel demo did not become ready"
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.58.0
          npx playwright install --with-deps chromium

      - name: Run three production browser flows
        env:
          YC_DEMO_URL: https://silvervisit-api.vercel.app/demo
        run: node backend/scripts/yc-browser-e2e.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yc-browser-e2e-screenshots
          path: yc-demo-run-*.png
          if-no-files-found: ignore
